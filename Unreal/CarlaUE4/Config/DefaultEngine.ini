[SystemSettings]

; BEGIN HumanDriver rendering defaults [SystemSettings]
; Apply groups before individual overrides, both here and at deferred startup.
; These are the Showdown starting groups, not a claim of measured performance.
sg.EffectsQuality=2
sg.PostProcessQuality=0
; Volumetric fog adds an unnecessary full-volume lighting pass to the default
; human-driving view. Keep ordinary exponential height fog; this disables only
; its volumetric component. The launcher reapplies this after CARLA quality.
r.VolumetricFog=0
; Avoid a desktop/mirror pacing limit competing with the XR runtime's wait.
t.MaxFPS=0
r.VSync=0
; Keep translucency in the main pass and use hardware occlusion queries.
r.SeparateTranslucency=0
r.HZBOcclusion=0
; Preserve stable headset imagery without blur, depth blur, lens flare or
; chromatic fringe. Cheap bloom remains available to materials.
r.MotionBlurQuality=0
r.BloomQuality=1
; CARLA daylight/post-process volumes rely on exposure adaptation. Disabling it
; as in the Showdown example overexposes this content until the scene looks white.
; Keep CARLA's exposure working in both eyes; a calibrated fixed exposure can be
; evaluated later, rather than assuming the example's lighting matches Town03.
r.EyeAdaptationQuality=2
r.AmbientOcclusionLevels=0
r.DepthOfFieldQuality=0
r.LensFlareQuality=0
r.SceneColorFringeQuality=0
r.FastBlurThreshold=0
; 32-bit HDR scene color reduces bandwidth; UE falls back if alpha is required
; or the device does not support this format. Check translucent materials in VR.
r.SceneColorFormat=2
; UE4.26 still allocates these cubic lighting volumes in forward mode. A small
; 4-voxel dimension limits that allocation even though forward skips filtering.
r.TranslucencyLightingVolumeDim=4
r.MaxAnisotropy=8
; Retain command-list submission rather than CARLA Epic's immediate-RHI bypass.
r.RHICmdBypass=0
; No vr.PixelDensity override: HumanDriver OpenXR preserves native density 1.
; The comparison profiler temporarily changes the existing console variable;
; native eye layouts/color/depth allocations now scale together and are restored.
; No SSR quality/roughness or volume-blur keys: forward skips those passes.
; END [SystemSettings] HumanDriver rendering defaults

