; BEGIN HumanDriver rendering defaults (Config/Rendering.ini)
; Authoritative project rendering defaults, shared by CLI, GUI and profiler.
; UE4 VR starting guidance (verified against this project's pinned UE4.26 fork):
; https://dev.epicgames.com/documentation/unreal-engine/virtual-reality-best-practices?application_version=4.27
; Setup merges these scalar settings into CARLA Config/DefaultEngine.ini.
; Forward shading and instanced stereo are shader/startup settings: restart
; Unreal after changing this file and allow the shader variants to compile.
; PC VR uses the forward renderer, including when the session uses the simulator.
; This deliberately replaces CARLA's deferred default without modifying C++.
r.ForwardShading=True
; Share stereo draw submission between eyes; ordinary desktop views stay mono.
vr.InstancedStereo=True
; CARLA enables a one-sample velocity MRT in the base pass. It cannot share
; that pass with four-sample forward scene color in this UE4.26 fork. Select
; the separate velocity path when an effect needs it; this is not a blanket
; disable of velocity rendering. Restart/recompile shaders after changing it.
r.BasePassOutputsVelocity=False
; UE4 enum: 3 = MSAA. Four samples improve headset clarity without temporal blur.
; MSAA requires forward shading and may cost more GPU time than Temporal AA.
r.DefaultFeature.AntiAliasing=3
r.MSAACount=4
; A positive AA quality is required by UE4's view setup, even for MSAA.
; Launcher restores these AA settings after CARLA's Low/Epic startup commands,
; which otherwise select FXAA and (at Low) set PostProcessAAQuality to zero.
r.PostProcessAAQuality=4
; Human-driving sessions do not capture semantic custom-depth/stencil images.
; Set this before map load to omit the global target/pass; a later console toggle
; does not clear already-set per-primitive bRenderCustomDepth flags. The separate
; annotation-component launch switch controls those CARLA-created components.
r.CustomDepth=0
; END HumanDriver rendering defaults

